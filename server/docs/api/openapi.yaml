openapi: 3.1.0
info:
  title: BIRDS API
  version: 1.0.0
  summary: Border Incident Reporting & Documentation System — Headquarters Border Guard Bangladesh
  description: |
    REST API behind the BIRDS web application (TEC specs #2, #31). CONFIDENTIAL // OPERATIONAL.

    ## Authentication
    1. `POST /auth/login` with username and password. The response contains a short-lived **access token**
       (RS256 JWT, 15 minutes) and sets the **refresh token** as an `httpOnly`, `SameSite=Strict` cookie
       (`birds_rt`, path `/api/v1/auth`).
    2. Send the access token on every request: `Authorization: Bearer <token>`.
    3. When a request returns `401` with code `TOKEN_INVALID`, call `POST /auth/refresh` (the browser sends
       the cookie) and retry. Only one refresh may be in flight: presenting an already-rotated refresh token
       more than 10 seconds later revokes the session (`TOKEN_REUSE`).
    4. Any other `401` (`SESSION_ENDED`, `SESSION_EXPIRED`) means the session is over: sign in again.

    Every request re-checks the session row, so logout, a new sign-in elsewhere (single-session policy),
    deactivation, role or scope changes, and the idle timeout take effect immediately.
    Requests sent with `X-Background-Request: 1` (automatic polling) do not count as user activity.

    ## Authorisation
    Each route requires a **page permission** (`dashboard`, `incidents`, `create`, `map`, `analytics`,
    `reports`, `audit`, `admin`) granted to the user's role in `role_permissions`. Data is also limited
    to the user's **scope** (HQ, sector, battalion or BOP); records outside it return `404` so their
    existence isn't revealed. Drafts are visible only to their creator. Nobody can act on an incident
    they filed themselves (separation of duties).

    ## Errors
    Every error uses one envelope: `{ "error": { "code": "...", "message": "...", "details": ... } }`.
    `400` validation errors put Zod's `{ formErrors, fieldErrors }` in `details`.

    ## Rate limits
    Failed sign-ins: 10 per IP per 15 minutes. Token refresh: 300 per IP per 15 minutes. Other routes:
    100 requests per minute per user (`API_RATE_LIMIT_PER_MINUTE`). Limit headers follow the IETF draft
    (`RateLimit`, `RateLimit-Policy`); exceeding a limit returns `429 RATE_LIMITED`.

    ## Dates
    Incident dates are `YYYY-MM-DD` and times `HH:MM` (Bangladesh Standard Time, as entered).
    Timestamps are ISO-8601 UTC. Exports show dates as `DD-MM-YYYY` and times in BST.
  contact:
    name: BIRDS project team
servers:
  - url: /api/v1
    description: Same origin as the web application (Nginx or the Vite dev server proxies /api)
  - url: http://localhost:4000/api/v1
    description: Local development API
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Incidents
  - name: Evidence
  - name: GIS
  - name: Reports
  - name: Audit
  - name: Notifications
  - name: Users
  - name: Admin
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service and database status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, enum: [up, down] }
                  time: { type: string, format: date-time }

  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with username and password
      description: 'Spec #4, #29. Failed attempts count towards the lockout (`password.max_attempts`). Sets the `birds_rt` refresh cookie.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 50, example: batt_op }
                password: { type: string, maxLength: 128, format: password }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { description: 'INVALID_CREDENTIALS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '423': { description: 'ACCOUNT_LOCKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh cookie for a new access token
      description: 'Rotates the refresh cookie. Send `X-Background-Request: 1` when the refresh was caused by automatic polling.'
      security: [{ refreshCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Background' }]
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { description: 'SESSION_ENDED or SESSION_EXPIRED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [manual, timeout], description: '`timeout` when the client idle timer ended the session (audited as SESSION_TIMEOUT)' }
      responses:
        '204': { description: Session ended and cookie cleared }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user, effective permissions and policy
      responses:
        '200':
          description: Signed-in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/CurrentUser' }
                  policy:
                    type: object
                    properties:
                      sessionTimeoutMinutes: { type: integer, example: 30 }
                      password: { $ref: '#/components/schemas/PasswordRules' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password
      description: 'Spec #29. Ends the user''s other sessions. Allowed even while a password change is required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: WRONG_PASSWORD, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/admin/reset-password:
    post:
      tags: [Auth]
      summary: Reset a user's password (admin)
      description: Returns the temporary password once; the user must change it at next sign-in. Ends the user's sessions.
      x-permission: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, example: U003 }
                temporaryPassword: { type: string, description: Omit to generate a policy-compliant password }
      responses:
        '200':
          description: Temporary password (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string }
                  username: { type: string }
                  temporaryPassword: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ Incidents
  /incidents:
    get:
      tags: [Incidents]
      summary: Search and list incidents
      description: 'Specs #15, #16. Scoped to the user; drafts only for their creator; archived records excluded unless `archived` says otherwise.'
      x-permission: incidents
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Sector'
        - $ref: '#/components/parameters/Battalion'
        - $ref: '#/components/parameters/Bop'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - { name: createdBy, in: query, schema: { type: string }, description: 'User id, or `me`' }
        - { name: needsAction, in: query, schema: { type: string, enum: ['true', 'false'] }, description: 'true = incidents the caller can act on now (their role''s workflow steps, not their own), plus their own Returned reports' }
        - { name: overdue, in: query, schema: { type: string, enum: ['true', 'false'] }, description: 'true = waiting longer than the workflow.overdue_days setting in their current step (Submitted, Reviewed, Verified, Approved, Returned; not archived)' }
        - $ref: '#/components/parameters/Archived'
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, incidentDate, id], default: createdAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of incidents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/IncidentSummary' } }
    post:
      tags: [Incidents]
      summary: File an incident (draft or submitted)
      description: 'Spec #5. Assigns the next `BIRDS-<year>-NNNN` reference. The location must be inside the user''s scope.'
      x-permission: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IncidentInput'
                - type: object
                  properties:
                    status: { type: string, enum: [Draft, Submitted], default: Draft }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /incidents/meta:
    get:
      tags: [Incidents]
      summary: Reference data for forms and filters
      description: 'Active categories with subcategories, the org units within the user''s scope, severities and statuses (specs #6, #9).'
      x-permission: incidents
      responses:
        '200':
          description: Reference data
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, subcategories: { type: array, items: { type: string } } } } }
                  hierarchy: { $ref: '#/components/schemas/Hierarchy' }
                  severities: { type: array, items: { $ref: '#/components/schemas/Severity' } }
                  statuses: { type: array, items: { $ref: '#/components/schemas/Status' } }
                  canAct: { type: boolean, description: 'The caller''s role takes part in review/approval (has a "Needs my action" view)' }
  /incidents/export/{format}:
    get:
      tags: [Reports]
      summary: Export incidents (same as /reports/export/{format})
      x-permission: reports
      parameters: [{ $ref: '#/components/parameters/Format' }]
      responses:
        '200': { $ref: '#/components/responses/File' }
  /incidents/{id}:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    get:
      tags: [Incidents]
      summary: Incident detail with timeline, evidence and the caller's permitted actions
      x-permission: incidents
      responses:
        '200': { description: Incident, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Incidents]
      summary: Edit a Draft or Returned incident (creator only)
      description: 'Spec #25. Any subset of the incident fields.'
      x-permission: create
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IncidentInput' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Incidents]
      summary: Discard a draft that was never submitted (creator only)
      description: 'Timeline rows are append-only (spec #25), so the record is kept, marked discarded and hidden from every view. Adds a "Discarded" timeline entry and a DISCARD_DRAFT audit entry. Only status Draft.'
      x-permission: create
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { notes: { type: string, maxLength: 2000, description: Optional reason } } } } }
      responses:
        '204': { description: Discarded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /incidents/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    post:
      tags: [Incidents]
      summary: Add a comment (append-only; notifies the creator and earlier commenters)
      description: 'Allowed for roles that file or review incidents, on records that are not drafts and not archived. Audited as COMMENT_INCIDENT. Comments are returned in the incident detail.'
      x-permission: incidents
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 4000 } } } } }
      responses:
        '201': { description: The incident with the new comment, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents/{id}/print:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    post:
      tags: [Incidents]
      summary: Record that the caller printed this incident (audit PRINT_INCIDENT); the browser does the printing
      x-permission: incidents
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents/{id}/timeline:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    get:
      tags: [Incidents]
      summary: 'Append-only incident history (spec #12)'
      x-permission: incidents
      responses:
        '200': { description: Timeline, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } } } } }
  /incidents/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    post:
      tags: [Incidents]
      summary: Submit a Draft, or resubmit a Returned incident (creator only)
      x-permission: create
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentDetail' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /incidents/{id}/{action}:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [review, verify, approve, close, return, reject] }
    post:
      tags: [Incidents]
      summary: 'Workflow action (specs #13, #14)'
      description: |
        | Action | From | Role |
        |---|---|---|
        | review | Submitted | Sector Officer, Verifier/Approver, HQ Administrator |
        | verify | Reviewed | Verifier/Approver, HQ Administrator |
        | approve | Verified | Verifier/Approver, HQ Administrator |
        | close | Approved | HQ Administrator |
        | return, reject | Submitted, Reviewed, Verified | as review; `notes` required |

        Wrong role → 403; wrong state or a concurrent action won → 409; both are audited as DENIED_WORKFLOW.
      x-permission: incidents
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 2000, description: Required for return and reject }
      responses:
        '200': { description: New state, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /incidents/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    post:
      tags: [Incidents]
      summary: 'Archive a Closed or Rejected incident (spec #45)'
      x-permission: admin
      responses:
        '200': { description: Archived, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentDetail' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /incidents/{id}/unarchive:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    post:
      tags: [Incidents]
      summary: Restore an archived incident (reason required)
      x-permission: admin
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [notes], properties: { notes: { type: string, maxLength: 2000 } } } } }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------------ Evidence
  /incidents/{id}/evidence:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    get:
      tags: [Evidence]
      summary: List evidence files
      x-permission: incidents
      responses:
        '200': { description: Evidence, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Evidence' } } } } }
    post:
      tags: [Evidence]
      summary: Upload evidence (creator, Draft/Returned only)
      description: |
        Specs #10, #11. JPEG, PNG, GIF, PDF, MP4 and MOV, checked on file content. Up to 10 files per request,
        50 MB per file, 500 MB per incident. One bad file rejects the whole batch. The server records SHA-256,
        EXIF/GPS metadata and stores files encrypted (AES-256-GCM).
      x-permission: create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files: { type: array, items: { type: string, format: binary } }
                lastModified: { type: array, items: { type: string }, description: Client last-modified time per file (ms since epoch) }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Evidence' } } } } }
        '413': { description: LIMIT_FILE_SIZE or QUOTA_EXCEEDED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: UNSUPPORTED_FILE_TYPE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /incidents/{id}/evidence/{eid}:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
      - { name: eid, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Evidence]
      summary: Download a file
      description: Audited. `Repr-Digest` carries the upload-time SHA-256. A file that fails its integrity check is never served (409 EVIDENCE_TAMPERED).
      x-permission: incidents
      parameters: [{ name: inline, in: query, schema: { type: string, enum: ['1'] }, description: Display in the browser where safe }]
      responses:
        '200': { $ref: '#/components/responses/File' }
        '404': { description: NOT_FOUND or FILE_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: EVIDENCE_TAMPERED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Evidence]
      summary: Soft-delete a file
      description: The creator while editing, or an HQ administrator at any stage with a reason. The stored file is kept.
      x-permission: incidents
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 2000 } } } } }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /incidents/{id}/evidence/{eid}/verify:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
      - { name: eid, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Evidence]
      summary: Re-check the stored file against its upload-time SHA-256 (chain of custody)
      x-permission: incidents
      responses:
        '200':
          description: Result (audited; a failure is logged as EVIDENCE_INTEGRITY_FAILURE)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  intact: { type: boolean }
                  fileFound: { type: boolean }
                  expectedSha256: { type: [string, 'null'] }
                  actualSha256: { type: [string, 'null'] }

  # ------------------------------------------------------------------ GIS
  /gis/incidents:
    get:
      tags: [GIS]
      summary: 'Geotagged incidents for the map (specs #8, #18)'
      x-permission: map
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Markers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    category: { type: string }
                    severity: { $ref: '#/components/schemas/Severity' }
                    status: { $ref: '#/components/schemas/Status' }
                    sector: { type: string }
                    battalion: { type: string }
                    bop: { type: string }
                    lat: { type: number }
                    lng: { type: number }
                    date: { type: string, format: date }

  # ------------------------------------------------------------------ Reports
  /reports/summary:
    get:
      tags: [Reports]
      summary: 'KPI summary (spec #17)'
      description: Filed incidents within scope, archived included. Accepts the incident list filters.
      x-permission: dashboard or analytics
      parameters: &reportFilters
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Sector'
        - $ref: '#/components/parameters/Battalion'
        - $ref: '#/components/parameters/Bop'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Archived'
      responses:
        '200':
          description: KPIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  pendingReview: { type: integer }
                  returned: { type: integer }
                  approved: { type: integer }
                  closed: { type: integer }
                  rejected: { type: integer }
                  open: { type: integer }
                  highSeverityOpen: { type: integer }
                  overdue: { type: integer, description: Waiting longer than workflow.overdue_days in one step }
                  byStatus: { type: object, additionalProperties: { type: integer } }
                  bySeverity: { type: object, additionalProperties: { type: integer } }
  /reports/trends:
    get:
      tags: [Reports]
      summary: 'Incident counts over time (spec #20)'
      description: Default range is the last 12 months; gaps are filled with zero; at most 750 periods.
      x-permission: dashboard or analytics
      parameters:
        - { name: granularity, in: query, schema: { type: string, enum: [day, week, month, quarter, year], default: month } }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Sector'
        - $ref: '#/components/parameters/Battalion'
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                type: object
                properties:
                  granularity: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        period: { type: string, example: 2026-10 }
                        start: { type: string, format: date }
                        count: { type: integer }
                        bySeverity: { type: object, additionalProperties: { type: integer } }
  /reports/by-category:
    get:
      tags: [Reports]
      summary: 'Counts per category with high-severity share and subcategory breakdown (spec #19)'
      x-permission: dashboard or analytics
      parameters: *reportFilters
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category: { type: string }
                    count: { type: integer }
                    highSeverity: { type: integer }
                    subcategories: { type: array, items: { type: object, properties: { name: { type: string }, count: { type: integer } } } }
  /reports/by-severity:
    get:
      tags: [Reports]
      summary: Counts per severity
      x-permission: dashboard or analytics
      parameters: *reportFilters
      responses:
        '200': { description: Severities, content: { application/json: { schema: { type: array, items: { type: object, properties: { severity: { $ref: '#/components/schemas/Severity' }, count: { type: integer } } } } } } }
  /reports/by-sector:
    get:
      tags: [Reports]
      summary: Risk distribution by sector (severity counts and weighted score)
      x-permission: dashboard or analytics
      parameters: *reportFilters
      responses:
        '200':
          description: Sectors, highest risk first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sector: { type: string }
                    total: { type: integer }
                    riskScore: { type: integer, description: 'Low 1, Medium 2, High 3, Critical 4 per incident' }
                    bySeverity: { type: object, additionalProperties: { type: integer } }
  /reports/operational:
    get:
      tags: [Reports]
      summary: 'Configurable report (spec #21)'
      x-permission: reports
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [operational, statistical, high-threat, sector-audit], default: operational } }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Sector'
        - $ref: '#/components/parameters/Battalion'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Report with summary, breakdowns and up to 5,000 rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      type: { type: string }
                      title: { type: string }
                      classification: { type: string, example: CONFIDENTIAL // OPERATIONAL }
                      generatedAt: { type: string, format: date-time }
                      generatedBy: { type: object, properties: { name: { type: string }, role: { type: string }, scope: { type: string } } }
                      filters: { type: object }
                      truncated: { type: boolean }
                  summary: { type: object }
                  bySeverity: { type: array, items: { type: object } }
                  byCategory: { type: array, items: { type: object } }
                  bySector: { type: array, items: { type: object } }
                  incidents: { type: array, items: { type: object } }
  /reports/export/{format}:
    get:
      tags: [Reports]
      summary: 'Export a report as CSV or Excel (spec #22)'
      description: Classification banner, BST times, UTF-8 BOM (CSV) and formula-injection protection. Audited as EXPORT_REPORT.
      x-permission: reports
      parameters:
        - $ref: '#/components/parameters/Format'
        - { name: type, in: query, schema: { type: string, enum: [operational, statistical, high-threat, sector-audit] } }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Sector'
        - $ref: '#/components/parameters/Battalion'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200': { $ref: '#/components/responses/File' }

  # ------------------------------------------------------------------ Audit
  /audit:
    get:
      tags: [Audit]
      summary: 'Search the audit log (spec #24)'
      description: Newest first. Viewing or searching (page 1) is itself logged as VIEW_AUDIT_LOG; an identical repeat within 60 s is not.
      x-permission: audit
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Username, details or IP' }
        - { name: action, in: query, schema: { type: string }, description: Comma-separated action names }
        - { name: username, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string, format: date }, description: Bangladesh calendar day }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                      actions: { type: array, items: { type: string }, description: 'All action names, for filters' }
  /audit/verify:
    get:
      tags: [Audit]
      summary: Verify the SHA-256 hash chain of the whole log
      x-permission: audit
      responses:
        '200':
          description: Result (audited)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rowsChecked: { type: integer }
                  intact: { type: boolean }
                  firstBrokenSeq: { type: [integer, 'null'] }
                  checkedAt: { type: string, format: date-time }
  /audit/export/{format}:
    get:
      tags: [Audit]
      summary: Export the audit log (up to 50,000 rows)
      x-permission: audit
      parameters: [{ $ref: '#/components/parameters/Format' }]
      responses:
        '200': { $ref: '#/components/responses/File' }

  # ------------------------------------------------------------------ Notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: 'The caller''s notifications (spec #23)'
      description: 'Poll every 30 s; send `X-Background-Request: 1` when the user has been idle.'
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Background'
      responses:
        '200':
          description: Notifications, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    properties:
                      unreadCount: { type: integer }
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            title: { type: string }
                            message: { type: string }
                            type: { type: string, enum: [submission, review, approval, return] }
                            read: { type: boolean }
                            incidentId: { type: [string, 'null'] }
                            createdAt: { type: string, format: date-time }
  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all as read
      responses:
        '200': { description: Done, content: { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } } }
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one as read
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Done }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Users
  /users:
    get:
      tags: [Users]
      summary: 'List user accounts (spec #3)'
      x-permission: admin
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/UserAdmin' } }
    post:
      tags: [Users]
      summary: Create a user
      description: Without `password` a temporary one is generated and returned once. New users always change their password at first sign-in.
      x-permission: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, name, role, scope, email]
              properties:
                username: { type: string, pattern: '^[a-z0-9_.]{3,50}$' }
                name: { type: string }
                role: { type: string, example: Battalion Operator }
                scope: { type: string, description: 'HQ, or a sector, battalion or BOP name', example: 17 BGB }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserAdmin' }
                  temporaryPassword: { type: string, description: Present only when generated }
        '409': { description: DUPLICATE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, example: U003 } }]
    get:
      tags: [Users]
      summary: User details
      x-permission: admin
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/UserAdmin' } } } }
    patch:
      tags: [Users]
      summary: Update name, role, scope, e-mail, active state, or unlock
      description: A role change, scope change or deactivation ends the user's sessions. Admins can't change their own role or deactivate themselves; one active HQ Administrator must remain (409 LAST_ADMIN).
      x-permission: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string }
                scope: { type: string }
                email: { type: string, format: email }
                isActive: { type: boolean }
                unlock: { type: boolean, enum: [true] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UserAdmin' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Users]
      summary: Deactivate (users are never deleted)
      x-permission: admin
      responses:
        '200': { description: Deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/UserAdmin' } } } }

  # ------------------------------------------------------------------ Admin
  /admin/config:
    get:
      tags: [Admin]
      summary: 'System settings (spec #47)'
      x-permission: admin
      responses:
        '200': { description: Settings, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConfigEntry' } } } } }
    patch:
      tags: [Admin]
      summary: Update settings (all-or-nothing, typed and range-checked; audited old → new)
      x-permission: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: [string, number, boolean] }
                  example: { session.timeout_minutes: 20, password.min_length: 10 }
      responses:
        '200': { description: All settings, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConfigEntry' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/roles/permissions:
    get:
      tags: [Admin]
      summary: 'Role → page permission matrix (spec #3)'
      x-permission: admin
      responses:
        '200': { $ref: '#/components/responses/Permissions' }
    patch:
      tags: [Admin]
      summary: Grant/revoke one page, or replace a role's set
      description: HQ Administrator always keeps `admin`. Takes effect immediately for every session.
      x-permission: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [role, pageId, enabled]
                  properties: { role: { type: string }, pageId: { $ref: '#/components/schemas/PageId' }, enabled: { type: boolean } }
                - type: object
                  required: [role, permissions]
                  properties: { role: { type: string }, permissions: { type: array, items: { $ref: '#/components/schemas/PageId' } } }
      responses:
        '200': { $ref: '#/components/responses/Permissions' }
  /admin/roles/permissions/reset:
    post:
      tags: [Admin]
      summary: Reset to factory defaults
      x-permission: admin
      responses:
        '200': { $ref: '#/components/responses/Permissions' }
  /admin/categories:
    get:
      tags: [Admin]
      summary: 'Categories and subcategories with usage counts (spec #6)'
      x-permission: admin
      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }
    post:
      tags: [Admin]
      summary: Add a category
      x-permission: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                subcategories: { type: array, items: { type: string }, maxItems: 50 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
  /admin/categories/{id}:
    patch:
      tags: [Admin]
      summary: Rename (if unused), (de)activate, add subcategories, (de)activate subcategories
      x-permission: admin
      parameters: [{ name: id, in: path, required: true, schema: { type: string, example: CAT01 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isActive: { type: boolean }
                addSubcategories: { type: array, items: { type: string } }
                subcategoryStatus: { type: array, items: { type: object, properties: { name: { type: string }, isActive: { type: boolean } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '409': { description: CATEGORY_IN_USE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/org-hierarchy:
    get:
      tags: [Admin]
      summary: 'Organizational hierarchy (spec #9)'
      x-permission: admin
      responses:
        '200': { $ref: '#/components/responses/OrgHierarchy' }
    post:
      tags: [Admin]
      summary: Add a BOP (and its sector/battalion if new). Units are never renamed or deleted.
      x-permission: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sector, battalion, bop]
              properties: { sector: { type: string }, battalion: { type: string }, bop: { type: string } }
      responses:
        '201': { $ref: '#/components/responses/OrgHierarchy' }
        '409': { description: HIERARCHY_CONFLICT or DUPLICATE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/archive:
    get:
      tags: [Admin]
      summary: 'Archiving and retention counts (specs #44, #45)'
      x-permission: admin
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveSummary' } } } }
  /admin/archive/run:
    post:
      tags: [Admin]
      summary: Archive all final incidents untouched for archive.after_days (also runs daily)
      x-permission: admin
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived: { type: integer }
                  skipped: { type: boolean, description: Another server process was running the job }
                  afterDays: { type: integer }
                  summary: { $ref: '#/components/schemas/ArchiveSummary' }
  /admin/mail:
    get:
      tags: [Admin]
      summary: 'E-mail delivery status and recent messages (spec #23)'
      x-permission: admin
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  transport: { type: string, enum: [smtp, json, none] }
                  from: { type: string }
                  server: { type: [string, 'null'] }
                  counts: { type: object, properties: { pending: { type: integer }, sent: { type: integer }, failed: { type: integer } } }
                  recent: { type: array, items: { type: object } }
  /admin/mail/test:
    post:
      tags: [Admin]
      summary: Send a test message to the admin's own address
      x-permission: admin
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { to: { type: string }, sent: { type: integer }, failed: { type: integer } } } } } }
        '400': { description: E-mail not configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (RS256, 15 minutes)
    refreshCookie:
      type: apiKey
      in: cookie
      name: birds_rt

  parameters:
    IncidentId: { name: id, in: path, required: true, schema: { type: string, pattern: '^BIRDS-\d{4}-\d{4,}$', example: BIRDS-2026-1001 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Q: { name: q, in: query, schema: { type: string, maxLength: 200 }, description: 'Reference number, title, description or location' }
    Status: { name: status, in: query, schema: { type: string, example: 'Submitted,Reviewed' }, description: Comma-separated statuses }
    Severity: { name: severity, in: query, schema: { type: string, example: 'High,Critical' }, description: Comma-separated severities }
    Category: { name: category, in: query, schema: { type: string } }
    Sector: { name: sector, in: query, schema: { type: string } }
    Battalion: { name: battalion, in: query, schema: { type: string } }
    Bop: { name: bop, in: query, schema: { type: string } }
    DateFrom: { name: dateFrom, in: query, schema: { type: string, format: date } }
    DateTo: { name: dateTo, in: query, schema: { type: string, format: date } }
    Archived: { name: archived, in: query, schema: { type: string, enum: [exclude, include, only] }, description: 'Lists default to exclude; reports default to include' }
    Format: { name: format, in: path, required: true, schema: { type: string, enum: [csv, excel] } }
    Background: { name: X-Background-Request, in: header, schema: { type: string, enum: ['1'] }, description: Automatic request; not user activity for the idle timeout }

  responses:
    Session:
      description: Signed in; refresh cookie set
      headers:
        Set-Cookie: { schema: { type: string }, description: 'birds_rt=…; HttpOnly; SameSite=Strict; Path=/api/v1/auth' }
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              tokenType: { type: string, example: Bearer }
              expiresIn: { type: integer, example: 900 }
              user: { $ref: '#/components/schemas/CurrentUser' }
    File:
      description: File download (Content-Disposition attachment)
      content:
        application/octet-stream: { schema: { type: string, format: binary } }
    Permissions:
      description: Permission matrix
      content:
        application/json:
          schema:
            type: object
            properties:
              pageIds: { type: array, items: { $ref: '#/components/schemas/PageId' } }
              roles: { type: array, items: { type: object, properties: { name: { type: string }, description: { type: string } } } }
              permissions: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/PageId' } } }
    OrgHierarchy:
      description: Hierarchy
      content:
        application/json:
          schema:
            type: object
            properties:
              hq: { type: string, example: HQ }
              hierarchy: { $ref: '#/components/schemas/Hierarchy' }
              units: { type: array, items: { type: object, properties: { sector: { type: string }, battalion: { type: string }, bop: { type: string } } } }
    BadRequest: { description: 'BAD_REQUEST / VALIDATION_ERROR', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: 'UNAUTHORIZED / TOKEN_INVALID / SESSION_ENDED / SESSION_EXPIRED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'FORBIDDEN (missing page permission, wrong role, or not the creator)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 'NOT_FOUND (or outside the caller''s scope)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 'INVALID_STATE (record not in a state that allows this, or changed concurrently)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: RATE_LIMITED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVALID_STATE }
            message: { type: string }
            details: {}
    PageInfo:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Severity: { type: string, enum: [Low, Medium, High, Critical] }
    Status: { type: string, enum: [Draft, Submitted, Reviewed, Verified, Approved, Closed, Returned, Rejected] }
    PageId: { type: string, enum: [dashboard, incidents, create, map, analytics, reports, audit, admin] }
    PasswordRules:
      type: object
      properties:
        minLength: { type: integer }
        requireUppercase: { type: boolean }
        requireNumber: { type: boolean }
        requireSpecial: { type: boolean }
    CurrentUser:
      type: object
      properties:
        id: { type: string, example: U003 }
        username: { type: string }
        name: { type: string }
        role: { type: string }
        scope: { type: string }
        email: { type: string }
        mustChangePassword: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/PageId' } }
    UserAdmin:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        name: { type: string }
        role: { type: string }
        scope: { type: string }
        email: { type: string }
        isActive: { type: boolean }
        locked: { type: boolean }
        lockedUntil: { type: [string, 'null'], format: date-time }
        failedAttempts: { type: integer }
        mustChangePassword: { type: boolean }
        lastLogin: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Hierarchy:
      type: object
      description: 'Sector → battalion → { BOPs: [...] }'
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          properties:
            BOPs: { type: array, items: { type: string } }
      example: { Sector-7: { 17 BGB: { BOPs: [BOP Teknaf, BOP Ghumdhum] } } }
    IncidentInput:
      type: object
      required: [title, category, severity, date, time, sector, battalion, bop, description]
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        category: { type: string }
        subcategory: { type: [string, 'null'] }
        severity: { $ref: '#/components/schemas/Severity' }
        date: { type: string, format: date, description: Not in the future }
        time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '02:30' }
        location: { type: [string, 'null'], maxLength: 255 }
        sector: { type: string }
        battalion: { type: string }
        bop: { type: string }
        lat: { type: [number, 'null'], minimum: -90, maximum: 90 }
        lng: { type: [number, 'null'], minimum: -180, maximum: 180 }
        description: { type: string, minLength: 10, maxLength: 10000 }
        personsInvolved: { type: [string, 'null'] }
        actionTaken: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
    IncidentSummary:
      type: object
      properties:
        id: { type: string, example: BIRDS-2026-1021 }
        title: { type: string }
        category: { type: string }
        subcategory: { type: [string, 'null'] }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/Status' }
        date: { type: string, format: date }
        time: { type: string, example: '02:30' }
        location: { type: [string, 'null'] }
        sector: { type: string }
        battalion: { type: string }
        bop: { type: string }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        createdBy: { type: string }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        statusChangedAt: { type: string, format: date-time, description: When the current status began }
        overdue: { type: boolean, description: 'Waiting longer than workflow.overdue_days in this step' }
        actions: { type: array, items: { type: string, enum: [review, verify, approve, close, return, reject] }, description: Workflow actions the caller may take now }
        canEdit: { type: boolean }
        canSubmit: { type: boolean }
        canDiscard: { type: boolean, description: The caller created this never-submitted draft and may discard it }
        canArchive: { type: boolean }
        canRestore: { type: boolean }
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          properties:
            description: { type: string }
            personsInvolved: { type: [string, 'null'] }
            actionTaken: { type: [string, 'null'] }
            outcome: { type: [string, 'null'] }
            timeline: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
            evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
            comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
            canComment: { type: boolean, description: 'The caller may comment (files incidents or reviews them; not on drafts or archived records)' }
    Comment:
      type: object
      properties:
        id: { type: integer }
        user: { type: string }
        userId: { type: string }
        body: { type: string }
        date: { type: string, format: date-time }
    TimelineEntry:
      type: object
      properties:
        action: { type: string, example: Returned }
        user: { type: string }
        userId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/Status' }
        notes: { type: [string, 'null'] }
        date: { type: string, format: date-time }
    Evidence:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        sha256: { type: [string, 'null'] }
        metadata: { type: object, description: 'SHA-256, detected/declared type, client last-modified, EXIF camera fields and GPS, scan result' }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        available: { type: boolean, description: False for seed placeholders without a stored file }
        downloadUrl: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        seq: { type: integer }
        timestamp: { type: string, format: date-time }
        username: { type: string }
        userId: { type: [string, 'null'] }
        action: { type: string, example: APPROVE_INCIDENT }
        details: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
        prevHash: { type: string }
        rowHash: { type: string }
    ConfigEntry:
      type: object
      properties:
        key: { type: string, example: session.timeout_minutes }
        value: { type: [string, number, boolean] }
        description: { type: string }
        editable: { type: boolean }
        type: { type: string, enum: [int, bool] }
        min: { type: integer }
        max: { type: integer }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    Category:
      type: object
      properties:
        id: { type: string, example: CAT01 }
        name: { type: string }
        isActive: { type: boolean }
        incidentCount: { type: integer }
        subcategories: { type: array, items: { type: object, properties: { name: { type: string }, isActive: { type: boolean } } } }
    ArchiveSummary:
      type: object
      properties:
        afterDays: { type: integer }
        retentionDays: { type: integer }
        active: { type: integer }
        archived: { type: integer }
        dueForArchive: { type: integer }
        pastRetention: { type: integer, description: Archived records older than the retention period (flagged for review; never deleted automatically) }
        lastRun: { type: [object, 'null'], properties: { at: { type: string, format: date-time }, details: { type: string } } }
