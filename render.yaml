# Render Blueprint: BIRDS TEC demo (DOUBT-010). One web service runs the API and serves the built
# SPA, so the browser sees a single origin. Database and evidence storage are on Supabase.
# Setup guide: server/docs/installation-guide/demo-hosting-render-supabase.md
# Demo data only. Production runs on BGB-hosted servers behind Nginx (CLAUDE.md §15).
services:
  - type: web
    name: birds-demo
    runtime: node
    region: singapore
    # Free: sleeps after 15 min without requests. KEEP_AWAKE_MINUTES below keeps it awake (the
    # server pings its own public URL). One always-on free service uses ~744 of the workspace's
    # 750 free instance hours a month. Starter (paid, always on) needs only this line changed.
    plan: free
    autoDeploy: false # deploy deliberately from the dashboard, never mid-demo
    # NODE_ENV=production is set at build time too, so devDependencies (Vite, TypeScript, Prisma CLI)
    # must be requested explicitly. The server's postinstall runs `prisma generate`.
    buildCommand: >-
      cd BGB && npm ci --include=dev && npm run build &&
      cd ../server && npm ci --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Relative to server/, where the start command runs
      - key: SERVE_SPA_DIR
        value: ../BGB/dist
      # Keep the free service awake: ping APP_BASE_URL/api/v1/health every 10 minutes
      - key: KEEP_AWAKE_MINUTES
        value: "10"
      # Render has more than one proxy hop (with "1", logs showed Render's own 10.x address). Trust its
      # private-network proxies by address instead, so req.ip is the first outside address = the client
      # (audit log, rate limits); addresses a client prepends itself are never reached
      - key: TRUST_PROXY
        value: loopback,uniquelocal
      # Supabase session pooler string (port 5432) for the non-superuser "birds" role, user name
      # birds.<project-ref>, ending in ?sslmode=verify-full&sslrootcert=<path to the Supabase CA certificate>.
      # Format: see server/docs/installation-guide/demo-hosting-render-supabase.md, step 1
      - key: DATABASE_URL
        sync: false
      # Small pool: the Supabase pooler limits client connections per project
      - key: DB_POOL_MAX
        value: "5"
      # https://<service>.onrender.com (or the custom domain), no trailing slash
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Secret Files (Render dashboard → Environment → Secret Files)
      - key: JWT_PRIVATE_KEY_PATH
        value: /etc/secrets/jwt-private.pem
      - key: JWT_PUBLIC_KEY_PATH
        value: /etc/secrets/jwt-public.pem
      # AES-256-GCM evidence key (`npm run keys:evidence`). Keep an offline copy: without it evidence is unreadable
      - key: EVIDENCE_ENCRYPTION_KEY
        sync: false
      # Evidence in a private Supabase Storage bucket over the S3 protocol (spec #33)
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT # https://<ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: evidence
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Supabase's free plan caps stored objects at 50 MB and encryption adds 36 bytes per file
      - key: EVIDENCE_MAX_FILE_MB
        value: "49"
      # No SMTP for the demo; in-app notifications still work (spec #23)
      - key: MAIL_TRANSPORT
        value: none
      # Swagger UI at /api/docs for the TEC (specs #31, #52)
      - key: API_DOCS
        value: "true"
      # Build-time: show the demo-account buttons on the login page
      - key: VITE_SHOW_DEMO_ACCOUNTS
        value: "true"
      # Audio calls: a free hosted TURN relay for the demo (for example Metered's free tier), so calls
      # connect across firewalls and mobile networks. Comma-separated turn:/turns: URLs + credentials
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # Web push for calls and messages while the app is closed: `npm run keys:vapid` (in server/).
      # Changing the keys turns notifications off on every device
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:birds-admin@bgb.gov.bd
